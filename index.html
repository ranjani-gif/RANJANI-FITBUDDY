<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitBuddy | AI Fitness Plan Generator</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <main class="page">
    <section class="card hero">
      <span class="badge">AI WELLNESS PLANNER</span>
      <h1>FitBuddy</h1>
      <p class="subtitle">Create a personalized 7-day workout and recovery plan.</p>

      {% if error %}
        <div class="alert error">{{ error }}</div>
      {% endif %}

      <form action="/generate-workout" method="post" class="form-grid">
        <label>
          Name
          <input name="username" required maxlength="100" placeholder="Your name">
        </label>

        <label>
          User ID
          <input name="user_id" required maxlength="100" placeholder="e.g. FB001">
        </label>

        <label>
          Age
          <input name="age" type="number" min="13" max="120" required>
        </label>

        <label>
          Weight (kg)
          <input name="weight" type="number" min="1" max="500" step="0.1" required>
        </label>

        <label>
          Fitness Goal
          <select name="goal" required>
            <option value="">Select a goal</option>
            <option>General wellness</option>
            <option>Strength</option>
            <option>Muscle gain</option>
            <option>Weight management</option>
            <option>Flexibility</option>
            <option>Cardio fitness</option>
          </select>
        </label>

        <label>
          Workout Intensity
          <select name="intensity" required>
            <option value="">Select intensity</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </label>

        <button class="button primary full" type="submit">Generate Plan</button>
      </form>

      <p class="note">
        FitBuddy provides general wellness information. It is not a substitute for advice from
        a qualified healthcare professional.
      </p>
    </section>
  </main>
</body>
</html>
